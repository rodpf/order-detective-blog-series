action_groups:
  - actions:
      - type: agent-request
        system_alias: ORDER_DETECTIVE_AGENT
        agent_type: remote
        result_variable: "apiResponse"
        body:
          configurations:
            pushNotifications: true
      - type: message
        message:
          type: text
          content: "<? apiResponse.body.artifacts[0].parts[0].text ?>"
